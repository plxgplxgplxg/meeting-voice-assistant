        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sig
      - in: query
        name: share
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Share
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
