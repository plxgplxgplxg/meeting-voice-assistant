components:
  schemas:
    ActionItemResponse:
      description: Schema representing an action item checklist task.
      properties:
        assignee:
          title: Assignee
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        due_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due Date
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        status:
          title: Status
          type: string
      required:
      - id
      - meeting_id
      - description
      - assignee
      - status
      - created_at
      title: ActionItemResponse
      type: object
    ActionItemUpdate:
      description: Schema for updating an action item status or assignee.
      properties:
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          anyOf:
          - pattern: ^(pending|completed)$
            type: string
          - type: 'null'
          title: Status
      title: ActionItemUpdate
      type: object
    AddProjectMemberRequest:
      description: Schema for inviting a member to a project via email.
      properties:
        email:
          format: email
          title: Email
          type: string
        role:
          default: viewer
          pattern: ^(editor|viewer)$
          title: Role
          type: string
      required:
      - email
      title: AddProjectMemberRequest
      type: object
    AgentActionResponse:
      description: A proposal and its outcome.
      properties:
        base_revision:
          title: Base Revision
          type: integer
        change_set_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Change Set Id
        conversation_id:
          format: uuid
          title: Conversation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        decided_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Decided At
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        preview:
          additionalProperties: true
          title: Preview
          type: object
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        status:
          title: Status
          type: string
      required:
      - id
      - conversation_id
      - meeting_id
      - kind
      - status
      - base_revision
      - payload
      - preview
      - created_at
      title: AgentActionResponse
      type: object
    ApproveRequest:
      description: Optional user edits applied to the proposal before it runs.
      properties:
        action_item_operations:
          anyOf:
          - items:
              discriminator:
                mapping:
                  create: '#/components/schemas/CreateActionItem'
                  delete: '#/components/schemas/DeleteActionItem'
                  update: '#/components/schemas/UpdateActionItem'
                propertyName: op
              oneOf:
              - $ref: '#/components/schemas/CreateActionItem'
              - $ref: '#/components/schemas/UpdateActionItem'
              - $ref: '#/components/schemas/DeleteActionItem'
            maxItems: 200
            type: array
          - type: 'null'
          title: Action Item Operations
        operations:
          anyOf:
          - items:
              discriminator:
                mapping:
                  delete_segments: '#/components/schemas/DeleteSegments'
                  merge_segments: '#/components/schemas/MergeSegments'
                  reassign_speaker: '#/components/schemas/ReassignSpeaker'
                  rename_speaker: '#/components/schemas/RenameSpeaker'
                  replace_text: '#/components/schemas/ReplaceText'
                  split_segment: '#/components/schemas/SplitSegment'
                  update_text: '#/components/schemas/UpdateText'
                propertyName: op
              oneOf:
              - $ref: '#/components/schemas/UpdateText'
              - $ref: '#/components/schemas/ReplaceText'
              - $ref: '#/components/schemas/RenameSpeaker'
              - $ref: '#/components/schemas/ReassignSpeaker'
              - $ref: '#/components/schemas/DeleteSegments'
              - $ref: '#/components/schemas/SplitSegment'
              - $ref: '#/components/schemas/MergeSegments'
            maxItems: 200
            type: array
          - type: 'null'
          title: Operations
      title: ApproveRequest
      type: object
    ArtifactCreateRequest:
      description: Request to generate a document for a meeting.
      properties:
        content_markdown:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Markdown
        kind:
          enum:
          - minutes_docx
          - email_draft
          - srt
          - custom_md
          title: Kind
          type: string
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - kind
      - title
      title: ArtifactCreateRequest
      type: object
    ArtifactResponse:
      description: A generated document.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        mime_type:
          title: Mime Type
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
        source_revision:
          title: Source Revision
          type: integer
        title:
          title: Title
          type: string
      required:
      - id
      - meeting_id
      - kind
      - title
      - mime_type
      - size_bytes
      - source_revision
      - created_at
      title: ArtifactResponse
      type: object
    AudioPlaybackResponse:
      description: Schema providing streaming playback URL and audio metadata.
      properties:
        audio_file_id:
          format: uuid
          title: Audio File Id
          type: string
        duration_seconds:
          title: Duration Seconds
          type: number
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        mime_type:
          title: Mime Type
          type: string
        stream_url:
          title: Stream Url
          type: string
      required:
      - meeting_id
      - audio_file_id
      - stream_url
      - mime_type
      - duration_seconds
      title: AudioPlaybackResponse
      type: object
    AudioStreamUrlResponse:
      description: Short-lived signed URL for streaming a meeting recording in an audio element.
      properties:
        expires_at:
          title: Expires At
          type: integer
        url:
          title: Url
          type: string
      required:
      - url
      - expires_at
      title: AudioStreamUrlResponse
      type: object
    AudioUploadResponse:
      description: Schema returned after an audio file is uploaded and queued.
      properties:
        audio_file_id:
          format: uuid
          title: Audio File Id
          type: string
        file_name:
          title: File Name
          type: string
        file_size_bytes:
          title: File Size Bytes
          type: integer
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        status:
          title: Status
          type: string
      required:
      - meeting_id
      - audio_file_id
      - file_name
      - file_size_bytes
      - status
      title: AudioUploadResponse
      type: object
    Body_upload_audio_file_api_v1_audio_upload_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        meeting_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Meeting Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - file
      title: Body_upload_audio_file_api_v1_audio_upload_post
      type: object
    Body_upload_meeting_audio_file_api_v1_audio_meetings__meeting_id__upload_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - file
      title: Body_upload_meeting_audio_file_api_v1_audio_meetings__meeting_id__upload_post
      type: object
    Body_upload_meeting_audio_file_api_v1_meetings__meeting_id__audio_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - file
      title: Body_upload_meeting_audio_file_api_v1_meetings__meeting_id__audio_post
      type: object
    BulkRenameSpeakerRequest:
      description: Schema for updating a speaker's name across all segments in a meeting.
      properties:
        new_speaker_label:
          maxLength: 100
          minLength: 1
          title: New Speaker Label
          type: string
        old_speaker_label:
          maxLength: 100
          minLength: 1
          title: Old Speaker Label
          type: string
      required:
      - old_speaker_label
      - new_speaker_label
      title: BulkRenameSpeakerRequest
      type: object
    ChangePasswordRequest:
      description: Schema for changing a user's password.
      properties:
        new_password:
          maxLength: 128
          minLength: 6
          title: New Password
          type: string
        old_password:
          title: Old Password
          type: string
      required:
      - old_password
      - new_password
      title: ChangePasswordRequest
      type: object
    ChangeSetDetailResponse:
      description: History entry with its segment-level changes.
      properties:
        actor_type:
          title: Actor Type
          type: string
        actor_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Actor User Id
        changes:
          items:
            $ref: '#/components/schemas/SegmentDiffResponse'
          title: Changes
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        operations:
          items:
            additionalProperties: true
            type: object
          title: Operations
          type: array
        reverted:
          default: false
          title: Reverted
          type: boolean
        reverts_change_set_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reverts Change Set Id
        revision:
          title: Revision
          type: integer
        summary:
          title: Summary
          type: string
      required:
      - id
      - revision
      - actor_type
      - summary
      - created_at
      - operations
      - changes
      title: ChangeSetDetailResponse
      type: object
    ChangeSetResultResponse:
      description: Outcome of applying or reverting operations.
      properties:
        affected_segment_ids:
          items:
            format: uuid
            type: string
          title: Affected Segment Ids
          type: array
        change_set_id:
          format: uuid
          title: Change Set Id
          type: string
        diff:
          $ref: '#/components/schemas/TranscriptDiffResponse'
        revision:
          title: Revision
          type: integer
      required:
      - change_set_id
      - revision
      - affected_segment_ids
      - diff
      title: ChangeSetResultResponse
      type: object
    ChangeSetSummaryResponse:
      description: One entry of the transcript history.
      properties:
        actor_type:
          title: Actor Type
          type: string
        actor_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Actor User Id
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        reverted:
          default: false
          title: Reverted
          type: boolean
        reverts_change_set_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reverts Change Set Id
        revision:
          title: Revision
          type: integer
        summary:
          title: Summary
          type: string
      required:
      - id
      - revision
      - actor_type
      - summary
      - created_at
      title: ChangeSetSummaryResponse
      type: object
    ChatMessageResponse:
      properties:
        citations:
          items:
            additionalProperties: true
            type: object
          title: Citations
          type: array
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        role:
          title: Role
          type: string
        status:
          default: ok
          title: Status
          type: string
        tool_calls:
          default: []
          items:
            additionalProperties: true
            type: object
          title: Tool Calls
          type: array
      required:
      - id
      - role
      - content
      - citations
      - created_at
      title: ChatMessageResponse
      type: object
    ChatQueryRequest:
      properties:
        query:
          minLength: 1
          title: Query
          type: string
      required:
      - query
      title: ChatQueryRequest
      type: object
    CheckoutRequest:
      description: Schema for initiating a plan upgrade / VietQR checkout session.
      properties:
        plan_slug:
          maxLength: 100
          minLength: 1
          title: Plan Slug
          type: string
      required:
      - plan_slug
      title: CheckoutRequest
      type: object
    CheckoutResponse:
      description: Schema providing VietQR code URL and bank transfer instructions.
      properties:
        account_name:
          title: Account Name
          type: string
        account_number:
          title: Account Number
          type: string
        amount:
          title: Amount
          type: number
        bank_code:
          title: Bank Code
          type: string
        currency:
          default: VND
          title: Currency
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        order_code:
          title: Order Code
          type: string
        order_id:
          format: uuid
          title: Order Id
          type: string
        qr_url:
          title: Qr Url
          type: string
        status:
          title: Status
          type: string
        transfer_content:
          title: Transfer Content
          type: string
      required:
      - order_id
      - order_code
      - amount
      - bank_code
      - account_number
      - account_name
      - transfer_content
      - qr_url
      - expires_at
      - status
      title: CheckoutResponse
      type: object
    CreateActionItem:
      description: Add a new action item.
      properties:
        assignee:
          anyOf:
          - maxLength: 150
            type: string
          - type: 'null'
          title: Assignee
        description:
          maxLength: 2000
          minLength: 1
          title: Description
          type: string
        due_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due Date
        op:
          const: create
          default: create
          title: Op
          type: string
      required:
      - description
      title: CreateActionItem
      type: object
    DeleteActionItem:
      description: Remove an action item.
      properties:
        action_item_id:
          format: uuid
          title: Action Item Id
          type: string
        op:
          const: delete
          default: delete
          title: Op
          type: string
      required:
      - action_item_id
      title: DeleteActionItem
      type: object
    DeleteSegments:
      description: Remove segments from the transcript.
      properties:
        op:
          const: delete_segments
          default: delete_segments
          title: Op
          type: string
        segment_ids:
          items:
            format: uuid
            type: string
          minItems: 1
          title: Segment Ids
          type: array
      required:
      - segment_ids
      title: DeleteSegments
      type: object
    DeleteSegmentsRequest:
      description: Schema for deleting multiple transcript segments.
      properties:
        segment_ids:
          items:
            format: uuid
            type: string
          minItems: 1
          title: Segment Ids
          type: array
      required:
      - segment_ids
      title: DeleteSegmentsRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MeetingCreate:
      description: Schema for initializing a new meeting.
      properties:
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: MeetingCreate
      type: object
    MeetingResponse:
      description: Schema representing meeting session details.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Created By
        duration_seconds:
          title: Duration Seconds
          type: number
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
        failure_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Stage
        id:
          format: uuid
          title: Id
          type: string
        index_status:
          default: none
          title: Index Status
          type: string
        is_deleted:
          default: false
          title: Is Deleted
          type: boolean
        is_demo:
          default: false
          title: Is Demo
          type: boolean
        share_permission:
          default: viewer
          title: Share Permission
          type: string
        share_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Share Token
        status:
          title: Status
          type: string
        summary_status:
          default: none
          title: Summary Status
          type: string
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
        transcript_revision:
          default: 0
          title: Transcript Revision
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - title
      - id
      - status
      - duration_seconds
      - created_at
      - updated_at
      title: MeetingResponse
      type: object
    MeetingShareLinkResponse:
      description: Schema returning a public or restricted shareable link.
      properties:
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        share_permission:
          title: Share Permission
          type: string
        share_token:
          title: Share Token
          type: string
        share_url:
          title: Share Url
          type: string
      required:
      - meeting_id
      - share_token
      - share_url
      - share_permission
      title: MeetingShareLinkResponse
      type: object
    MeetingUpdate:
      description: Schema for updating meeting attributes.
      properties:
        title:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: MeetingUpdate
      type: object
    MergeSegments:
      description: Merge adjacent segments of one speaker into the first of them.
      properties:
        op:
          const: merge_segments
          default: merge_segments
          title: Op
          type: string
        segment_ids:
          items:
            format: uuid
            type: string
          minItems: 2
          title: Segment Ids
          type: array
      required:
      - segment_ids
      title: MergeSegments
      type: object
    OperationsPreviewRequest:
      description: Batch of transcript operations to preview without writing.
      properties:
        operations:
          items:
            discriminator:
              mapping:
                delete_segments: '#/components/schemas/DeleteSegments'
                merge_segments: '#/components/schemas/MergeSegments'
                reassign_speaker: '#/components/schemas/ReassignSpeaker'
                rename_speaker: '#/components/schemas/RenameSpeaker'
                replace_text: '#/components/schemas/ReplaceText'
                split_segment: '#/components/schemas/SplitSegment'
                update_text: '#/components/schemas/UpdateText'
              propertyName: op
            oneOf:
            - $ref: '#/components/schemas/UpdateText'
            - $ref: '#/components/schemas/ReplaceText'
            - $ref: '#/components/schemas/RenameSpeaker'
            - $ref: '#/components/schemas/ReassignSpeaker'
            - $ref: '#/components/schemas/DeleteSegments'
            - $ref: '#/components/schemas/SplitSegment'
            - $ref: '#/components/schemas/MergeSegments'
          maxItems: 200
          minItems: 1
          title: Operations
          type: array
      required:
      - operations
      title: OperationsPreviewRequest
      type: object
    OperationsRequest:
      description: Batch of transcript operations applied as one change set.
      properties:
        expected_revision:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Revision
        operations:
          items:
            discriminator:
              mapping:
                delete_segments: '#/components/schemas/DeleteSegments'
                merge_segments: '#/components/schemas/MergeSegments'
                reassign_speaker: '#/components/schemas/ReassignSpeaker'
                rename_speaker: '#/components/schemas/RenameSpeaker'
                replace_text: '#/components/schemas/ReplaceText'
                split_segment: '#/components/schemas/SplitSegment'
                update_text: '#/components/schemas/UpdateText'
              propertyName: op
            oneOf:
            - $ref: '#/components/schemas/UpdateText'
            - $ref: '#/components/schemas/ReplaceText'
            - $ref: '#/components/schemas/RenameSpeaker'
            - $ref: '#/components/schemas/ReassignSpeaker'
            - $ref: '#/components/schemas/DeleteSegments'
            - $ref: '#/components/schemas/SplitSegment'
            - $ref: '#/components/schemas/MergeSegments'
          maxItems: 200
          minItems: 1
          title: Operations
          type: array
        reason:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Reason
      required:
      - operations
      title: OperationsRequest
      type: object
    OrderStatusResponse:
      description: Schema checking payment order fulfillment status.
      properties:
        order_code:
          title: Order Code
          type: string
        paid_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paid At
        status:
          title: Status
          type: string
      required:
      - order_code
      - status
      title: OrderStatusResponse
      type: object
    PlanResponse:
      description: Schema representing an available subscription plan tier.
      properties:
        billing_interval:
          title: Billing Interval
          type: string
        currency:
          default: VND
          title: Currency
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        features:
          additionalProperties: true
          title: Features
          type: object
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_default:
          title: Is Default
          type: boolean
        name:
          title: Name
          type: string
        price_amount:
          title: Price Amount
          type: number
        slug:
          title: Slug
          type: string
        total_duration_limit_minutes:
          title: Total Duration Limit Minutes
          type: integer
      required:
      - id
      - slug
      - name
      - price_amount
      - billing_interval
      - total_duration_limit_minutes
      - is_default
      - is_active
      title: PlanResponse
      type: object
    ProjectCreateRequest:
      description: Schema for creating a new workspace project.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: ProjectCreateRequest
      type: object
    ProjectMemberResponse:
      description: Schema representing a project member and their role.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          format: email
          title: Email
          type: string
        full_name:
          title: Full Name
          type: string
        id:
          format: uuid
          title: Id
          type: string
        role:
          title: Role
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - email
      - full_name
      - role
      - created_at
      title: ProjectMemberResponse
      type: object
    ProjectResponse:
      description: Schema for workspace project summary.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        meetings_count:
          default: 0
          title: Meetings Count
          type: integer
        members_count:
          default: 1
          title: Members Count
          type: integer
        my_role:
          anyOf:
          - type: string
          - type: 'null'
          title: My Role
        name:
          title: Name
          type: string
        owner_id:
          format: uuid
          title: Owner Id
          type: string
      required:
      - id
      - name
      - owner_id
      - created_at
      title: ProjectResponse
      type: object
    ProjectUpdateRequest:
      description: Schema for updating an existing workspace project.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: ProjectUpdateRequest
      type: object
    ReassignSpeaker:
      description: Attribute specific segments to another speaker.
      properties:
        new_label:
          maxLength: 100
          minLength: 1
          title: New Label
          type: string
        op:
          const: reassign_speaker
          default: reassign_speaker
          title: Op
          type: string
        segment_ids:
          items:
            format: uuid
            type: string
          minItems: 1
          title: Segment Ids
          type: array
      required:
      - segment_ids
      - new_label
      title: ReassignSpeaker
      type: object
    RefreshTokenRequest:
      description: Schema for refreshing an expired access token.
      properties:
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshTokenRequest
      type: object
    RenameSpeaker:
      description: Rename a speaker label in every segment that uses it.
      properties:
        new_label:
          maxLength: 100
          minLength: 1
          title: New Label
          type: string
        old_label:
          maxLength: 100
          minLength: 1
          title: Old Label
          type: string
        op:
          const: rename_speaker
          default: rename_speaker
          title: Op
          type: string
      required:
      - old_label
      - new_label
      title: RenameSpeaker
      type: object
    ReplaceText:
      description: 'Find and replace text across all segments or a chosen subset.


        Example: rename ''Gemany'' to ''Gemini'' everywhere.'
      properties:
        case_sensitive:
          default: false
          title: Case Sensitive
          type: boolean
        find:
          minLength: 1
          title: Find
          type: string
        op:
          const: replace_text
          default: replace_text
          title: Op
          type: string
        replace:
          title: Replace
          type: string
        scope:
          default: all
          enum:
          - all
          - segments
          title: Scope
          type: string
        segment_ids:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Segment Ids
        whole_word:
          default: false
          title: Whole Word
          type: boolean
      required:
      - find
      - replace
      title: ReplaceText
      type: object
    SegmentDiffResponse:
      description: Before and after state of one segment in a change set or preview.
      properties:
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        op:
          enum:
          - update
          - delete
          - insert
          title: Op
          type: string
        order_only:
          default: false
          title: Order Only
          type: boolean
        segment_id:
          format: uuid
          title: Segment Id
          type: string
      required:
      - op
      - segment_id
      title: SegmentDiffResponse
      type: object
    SplitSegment:
      description: Split one segment into two at a character offset and a time.
      properties:
        at_char:
          minimum: 1.0
          title: At Char
          type: integer
        op:
          const: split_segment
          default: split_segment
          title: Op
          type: string
        segment_id:
          format: uuid
          title: Segment Id
          type: string
        split_time:
          minimum: 0.0
          title: Split Time
          type: number
      required:
      - segment_id
      - at_char
      - split_time
      title: SplitSegment
      type: object
    SubscriptionResponse:
      description: Schema representing user's current subscription and quota usage.
      properties:
        current_period_end:
          format: date-time
          title: Current Period End
          type: string
        id:
          format: uuid
          title: Id
          type: string
        plan_name:
          title: Plan Name
          type: string
        plan_slug:
          title: Plan Slug
          type: string
        remaining_duration_minutes:
          title: Remaining Duration Minutes
          type: number
        status:
          title: Status
          type: string
        total_duration_limit_minutes:
          title: Total Duration Limit Minutes
          type: integer
        used_duration_minutes:
          title: Used Duration Minutes
          type: number
      required:
      - id
      - plan_slug
      - plan_name
      - status
      - current_period_end
      - total_duration_limit_minutes
      - used_duration_minutes
      - remaining_duration_minutes
      title: SubscriptionResponse
      type: object
    SummaryResponse:
      description: Schema representing AI meeting summary.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        executive_summary:
          title: Executive Summary
          type: string
        id:
          format: uuid
          title: Id
          type: string
        key_points:
          items: {}
          title: Key Points
          type: array
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
      required:
      - id
      - meeting_id
      - executive_summary
      - key_points
      - created_at
      title: SummaryResponse
      type: object
    TokenResponse:
      description: Schema for returning JWT tokens after successful authentication.
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        refresh_token:
          title: Refresh Token
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - refresh_token
      - expires_in
      title: TokenResponse
      type: object
    TranscriptDiffResponse:
      description: Preview of what a batch of operations would change.
      properties:
        base_revision:
          title: Base Revision
          type: integer
        changes:
          items:
            $ref: '#/components/schemas/SegmentDiffResponse'
          title: Changes
          type: array
        summary:
          title: Summary
          type: string
      required:
      - changes
      - summary
      - base_revision
      title: TranscriptDiffResponse
      type: object
    TranscriptSegmentResponse:
      description: Schema representing an individual chronological transcript turn.
      properties:
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        end_time:
          title: End Time
          type: number
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        sequence_order:
          title: Sequence Order
          type: integer
        speaker_label:
          title: Speaker Label
          type: string
        start_time:
          title: Start Time
          type: number
        version:
          default: 1
          title: Version
          type: integer
      required:
      - id
      - meeting_id
      - speaker_label
      - start_time
      - end_time
      - content
      - sequence_order
      - created_at
      title: TranscriptSegmentResponse
      type: object
    TranscriptSegmentUpdate:
      description: Schema for updating an individual transcript segment.
      properties:
        content:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Content
        speaker_label:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Speaker Label
      title: TranscriptSegmentUpdate
      type: object
    TurnRequest:
      description: A message to the meeting assistant.
      properties:
        message:
          maxLength: 4000
          minLength: 1
          title: Message
          type: string
      required:
      - message
      title: TurnRequest
      type: object
    UpdateActionItem:
      description: Change fields of an existing action item.
      properties:
        action_item_id:
          format: uuid
          title: Action Item Id
          type: string
        assignee:
          anyOf:
          - maxLength: 150
            type: string
          - type: 'null'
          title: Assignee
        description:
          anyOf:
          - maxLength: 2000
            minLength: 1
            type: string
          - type: 'null'
          title: Description
        due_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due Date
        op:
          const: update
          default: update
          title: Op
          type: string
        status:
          anyOf:
          - enum:
            - pending
            - completed
            type: string
          - type: 'null'
          title: Status
      required:
      - action_item_id
      title: UpdateActionItem
      type: object
    UpdateProjectMemberRoleRequest:
      description: Schema for updating a member's project access role.
      properties:
        role:
          pattern: ^(editor|viewer)$
          title: Role
          type: string
      required:
      - role
      title: UpdateProjectMemberRoleRequest
      type: object
    UpdateText:
      description: Replace the text of one segment.
      properties:
        new_text:
          minLength: 1
          title: New Text
          type: string
        op:
          const: update_text
          default: update_text
          title: Op
          type: string
        segment_id:
          format: uuid
          title: Segment Id
          type: string
      required:
      - segment_id
      - new_text
      title: UpdateText
      type: object
    UserLoginRequest:
      description: Schema for user authentication credentials.
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: UserLoginRequest
      type: object
    UserRegisterRequest:
      description: Schema for user account registration.
      properties:
        email:
          format: email
          title: Email
          type: string
        full_name:
          maxLength: 255
          minLength: 2
          title: Full Name
          type: string
        password:
          maxLength: 128
          minLength: 6
          title: Password
          type: string
      required:
      - email
      - full_name
      - password
      title: UserRegisterRequest
      type: object
    UserResponse:
      description: Schema representing user profile details.
      properties:
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          format: email
          title: Email
          type: string
        full_name:
          title: Full Name
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      - created_at
      title: UserResponse
      type: object
    UserUpdateRequest:
      description: Schema for updating basic user profile information.
      properties:
        avatar_url:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          title: Avatar Url
        full_name:
          anyOf:
          - maxLength: 255
            minLength: 2
            type: string
          - type: 'null'
          title: Full Name
      title: UserUpdateRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: Meeting Intelligence Backend API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/audio/meetings/{meeting_id}/upload:
    post:
      deprecated: true
      description: Upload a recording attached to an existing meeting (requires edit access).
      operationId: upload_meeting_audio_file_api_v1_audio_meetings__meeting_id__upload_post
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: query
        name: share
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Share
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_meeting_audio_file_api_v1_audio_meetings__meeting_id__upload_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Upload Meeting Audio File
      tags:
      - Audio (deprecated paths)
  /api/v1/audio/upload:
    post:
      description: Upload a recording, creating a new meeting or attaching to an editable one.
