      tags:
      - Audio (deprecated paths)
  /api/v1/audio/{meeting_id}/stream:
    get:
      deprecated: true
      description: 'Stream the audio file with HTTP Range support for timeline scrubbing.


        Access is granted either by a valid signed URL or by VIEW permission.'
      operationId: stream_meeting_audio_api_v1_audio__meeting_id__stream_get
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: query
        name: exp
