    post:
      description: Create a new meeting owned by the authenticated user.
      operationId: create_meeting_api_v1_meetings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Meeting
      tags:
      - Meetings
  /api/v1/meetings/{meeting_id}:
    delete:
      description: Soft delete a meeting (creator only).
      operationId: delete_meeting_api_v1_meetings__meeting_id__delete
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: query
        name: share
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Share
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Meeting
      tags:
