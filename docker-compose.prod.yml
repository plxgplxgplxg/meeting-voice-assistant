services:
  nginx:
    image: nginx:alpine
    container_name: meeting_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - meeting_storage:/tmp/meeting_storage:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: meeting_backend_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - SEPAY_BANK_CODE=${SEPAY_BANK_CODE:-MBBank}
      - SEPAY_ACCOUNT_NUMBER=${SEPAY_ACCOUNT_NUMBER:-0987654321}
      - SEPAY_ACCOUNT_NAME=${SEPAY_ACCOUNT_NAME:?Set SEPAY_ACCOUNT_NAME in .env}
      - SEPAY_WEBHOOK_API_KEY=${SEPAY_WEBHOOK_API_KEY:?Set SEPAY_WEBHOOK_API_KEY in .env}
      - STORAGE_ROOT=/tmp/meeting_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - meeting_storage:/tmp/meeting_storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: meeting_celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      - ENVIRONMENT=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - SEPAY_WEBHOOK_API_KEY=${SEPAY_WEBHOOK_API_KEY:?Set SEPAY_WEBHOOK_API_KEY in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      - STORAGE_ROOT=/tmp/meeting_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - meeting_storage:/tmp/meeting_storage

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: meeting_ai_service
    restart: always
    environment:
      - ENVIRONMENT=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - GLADIA_API_KEY=${GLADIA_API_KEY:?Set GLADIA_API_KEY in .env}
      - GLADIA_BASE_URL=${GLADIA_BASE_URL:-https://api.gladia.io}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AUDIO_PIPELINE_ENGINE=${AUDIO_PIPELINE_ENGINE:-gladia}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-small}
      - DEVICE=${DEVICE:-cpu}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      - STORAGE_ROOT=/tmp/meeting_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - meeting_storage:/tmp/meeting_storage:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_frontend
    restart: always
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  redis_data:
  meeting_storage:
  certbot_www:
  letsencrypt:
