services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: meeting_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - SECRET_KEY=${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      - SEPAY_BANK_CODE=${SEPAY_BANK_CODE:-MBBank}
      - SEPAY_ACCOUNT_NUMBER=${SEPAY_ACCOUNT_NUMBER:-0987654321}
      - SEPAY_ACCOUNT_NAME=${SEPAY_ACCOUNT_NAME:-NGUYEN PHUONG LINH}
      - SEPAY_WEBHOOK_API_KEY=${SEPAY_WEBHOOK_API_KEY:-sepay_secret_key_demo}
      - STORAGE_ROOT=/tmp/meeting_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-api:/app
      - meeting_storage:/tmp/meeting_storage

  celery-worker:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: meeting_celery_worker
    restart: always
    command: celery -A app.workers.celery_worker.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - STORAGE_ROOT=/tmp/meeting_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    volumes:
      - ./backend-api:/app
      - meeting_storage:/tmp/meeting_storage

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: meeting_ai_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - GLADIA_API_KEY=${GLADIA_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AUDIO_PIPELINE_ENGINE=${AUDIO_PIPELINE_ENGINE:-gladia}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ai-service:/app
      - meeting_storage:/tmp/meeting_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8000}
    depends_on:
      - backend-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  meeting_storage:
